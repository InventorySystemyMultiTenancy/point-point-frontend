<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/pointpoint-logo.png" />
    <link
      rel="alternate icon"
      type="image/png"
      href="/assets/pointpoint-logo.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="manifest" href="/manifest.json" />

    <title>Point&Point - Loja de Pelúcias</title>
    <meta
      name="description"
      content="Point&Point - Loja de pelúcias fofas e exclusivas. Compre pelúcias de alta qualidade, pague online e receba em casa!"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Cores Point&Point */
      :root {
        --color-primary: #7e22ce;
        --color-secondary: #d2b48c;
        --color-accent: #6d28d9;
        --color-primary-hover: #6d28d9;
        --color-primary-active: #5b21b6;
        --color-primary-light: #fff6e5;
        --color-primary-lighter: #fffaf0;
      }

      body {
        font-family: "Poppins", sans-serif;
        /* IMPEDE O "PULL-TO-REFRESH" (PUXAR PRA CIMA) QUE ESTRAGA O KIOSK */
        overscroll-behavior-y: contain;
        /* Desabilita seleÃ§Ã£o de texto para parecer app */
        user-select: none;
        -webkit-user-select: none;
      }

      /* AnimaÃ§Ãµes existentes */
      @keyframes fade-in-down {
        0% {
          opacity: 0;
          transform: translateY(-20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-down {
        animation: fade-in-down 0.5s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-stone-50">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
